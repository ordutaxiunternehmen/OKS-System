# Supabase-Projekteinstellungen für die Server-Funktionen
[functions.mollie-webhook]
verify_jwt = false   # Mollie ruft ohne Login auf; Sicherheit über Rückfrage bei Mollie

[functions.daily-check]
verify_jwt = false   # geschützt über x-cron-secret

[functions.app-code]
verify_jwt = true

[functions.billing]
verify_jwt = true

[functions.admin]
verify_jwt = true

[functions.admin-setup]
verify_jwt = false   # Anlage ohne Login, geschützt über ADMIN_SETUP_CODE
